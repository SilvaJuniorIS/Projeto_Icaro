name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ICARO_AUTH_USER: ci_user
      ICARO_AUTH_PASSWORD: ci_password
      ICARO_AUTH_SECRET: ci_secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx ruff

      - name: Lint
        run: ruff check src/ api.py

      - name: Tests
        run: python -m pytest tests/ -v
